version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: idrm-demo-claudecode-api
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - idrm-demo-claudecode-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: idrm-demo-claudecode-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=idrm
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - idrm-demo-claudecode-network

networks:
  idrm-demo-claudecode-network:
    driver: bridge

volumes:
  mysql-data:
