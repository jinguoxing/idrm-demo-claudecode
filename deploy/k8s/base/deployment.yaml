apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrm-demo-claudecode-api
  labels:
    app: idrm-demo-claudecode
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idrm-demo-claudecode
      component: api
  template:
    metadata:
      labels:
        app: idrm-demo-claudecode
        component: api
    spec:
      containers:
        - name: api
          image: docker.io/idrm-demo-claudecode:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /app/etc
      volumes:
        - name: config-volume
          configMap:
            name: idrm-demo-claudecode-config
