apiVersion: v1
kind: ConfigMap
metadata:
  name: idrm-demo-claudecode-config
  labels:
    app: idrm-demo-claudecode
data:
  api.yaml: |
    Name: idrm-demo-claudecode-api
    Host: 0.0.0.0
    Port: 8888

    Telemetry:
      ServiceName: idrm-demo-claudecode-api
      ServiceVersion: 1.0.0
      Environment: production
      
      Log:
        Level: info
        Mode: console
        KeepDays: 7

    DB:
      Default:
        Host: localhost
        Port: 3306
        Database: idrm
        Username: root
        Password: 123456
        Charset: utf8mb4
        MaxIdleConns: 10
        MaxOpenConns: 100
        ConnMaxLifetime: 3600
        LogLevel: warn
        SlowThreshold: 200

    Auth:
      AccessSecret: 94dddffea62801cb4d60d45b80a8b745c59d742716faa96ae03cbd12d436263c
      AccessExpire: 7200
